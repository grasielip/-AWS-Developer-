<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS Exam Pro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/quiz.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/flashcards.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>AWS Exam Pro</h1>
      <nav>
        <button class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="quiz">Quiz</button>
        <button class="nav-btn" data-view="flashcards">Flashcards</button>
      </nav>
    </header>

    <main>
      <div class="card user-card">
        <div id="user-summary" class="user-summary hidden"></div>
        <div id="login-link-wrapper">
          <a id="login-link" class="primary-btn" href="login.html">Entrar</a>
        </div>
        <button id="logout-button" class="secondary-btn hidden">Sair</button>
      </div>
      <section id="dashboard" class="view active">
        <div class="hero-card">
          <h2>Seu progresso em AWS</h2>
          <p>Acompanhe questões, acertos e revisões.</p>
        </div>
        <div class="stats-grid">
          <article class="card stat-card">
            <h3>Questões respondidas</h3>
            <p id="answered-count">0</p>
          </article>
          <article class="card stat-card">
            <h3>Taxa de acerto</h3>
            <p id="accuracy-rate">0%</p>
          </article>
          <article class="card stat-card">
            <h3>Flashcards revisados</h3>
            <p id="reviewed-count">0</p>
          </article>
        </div>
        <div class="card chart-card">
          <h3>Desempenho por categoria</h3>
          <canvas id="performance-chart"></canvas>
        </div>
      </section>

      <section id="quiz" class="view">
        <div class="card filter-card">
          <h3>Filtro de certificação</h3>
          <div class="filter-row">
            <label>
              Nível
              <select id="filter-level" class="filter-level">
                <option value="all">Todos</option>
                <option value="practitioner">Practitioner</option>
                <option value="associate">Associate</option>
                <option value="professional">Professional</option>
                <option value="specialty">Specialty</option>
              </select>
            </label>
            <label>
              Certificação
              <select id="filter-certification" class="filter-certification">
                <option value="all">Todos</option>
              </select>
            </label>
            <label>
              Domínio
              <select id="filter-domain" class="filter-domain">
                <option value="all">Todos</option>
              </select>
            </label>
          </div>
          <div class="filter-actions">
            <button id="clear-filters" class="secondary-btn" type="button">Limpar filtros</button>
            <span id="filter-summary" class="filter-summary">Filtros: Todos</span>
          </div>
        </div>

        <div class="card quiz-card">
          <h2>Quiz interativo</h2>
          <div id="quiz-question"></div>
          <div id="quiz-options"></div>
          <button id="next-question" class="primary-btn">Próxima pergunta</button>
        </div>
      </section>

      <section id="flashcards" class="view">
        <div class="card filter-card">
          <h3>Filtro de flashcards</h3>
          <div class="filter-row">
            <label>
              Nível
              <select class="filter-level">
                <option value="all">Todos</option>
                <option value="practitioner">Practitioner</option>
                <option value="associate">Associate</option>
                <option value="professional">Professional</option>
                <option value="specialty">Specialty</option>
              </select>
            </label>
            <label>
              Certificação
              <select class="filter-certification">
                <option value="all">Todos</option>
              </select>
            </label>
            <label>
              Domínio
              <select class="filter-domain">
                <option value="all">Todos</option>
              </select>
            </label>
          </div>
        </div>
        <div class="card flashcard-card">
          <h2>Flashcards</h2>
          <div class="flashcard-container">
            <div class="flashcard-inner" id="flashcard">
              <div class="flashcard-face front"></div>
              <div class="flashcard-face back"></div>
            </div>
          </div>
          <div class="flashcard-actions">
            <button id="toggle-answer" class="primary-btn" type="button">Mostrar resposta</button>
            <button id="next-flashcard" class="secondary-btn" type="button">Próximo</button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/database.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/flashcards.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
